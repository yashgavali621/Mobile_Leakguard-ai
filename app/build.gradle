plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { localProperties.load(it) }
}
// Fall back to empty strings so the build never fails just because
// local.properties hasn't been created yet - BuildConfig fields will
// simply be blank and SupabaseConfig will surface a clear runtime error.
static def prop(Properties p, String key) {
    return p.getProperty(key, "")
}

android {
    namespace 'com.leakguard.ai'
    compileSdk 34

    defaultConfig {
        applicationId "com.leakguard.ai"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0-phase1"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SUPABASE_URL", "\"${prop(localProperties, 'SUPABASE_URL')}\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"${prop(localProperties, 'SUPABASE_PUBLISHABLE_KEY')}\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${prop(localProperties, 'GOOGLE_WEB_CLIENT_ID')}\""
        buildConfigField "String", "GOOGLE_ANDROID_CLIENT_ID", "\"${prop(localProperties, 'GOOGLE_ANDROID_CLIENT_ID')}\""
        buildConfigField "String", "BACKEND_BASE_URL", "\"${prop(localProperties, 'BACKEND_BASE_URL')}\""
    }

    buildTypes {
        debug {
            debuggable true
            buildConfigField "boolean", "VERBOSE_LOGGING", "true"
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "boolean", "VERBOSE_LOGGING", "false"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    testOptions {
        unitTests.returnDefaultValues = true
    }

    packagingOptions {
        resources {
            excludes += ['META-INF/DEPENDENCIES', 'META-INF/LICENSE', 'META-INF/LICENSE.txt', 'META-INF/NOTICE', 'META-INF/NOTICE.txt']
        }
    }
}

dependencies {
    // Core AndroidX
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'androidx.viewpager2:viewpager2:1.1.0'
    implementation 'androidx.fragment:fragment:1.8.2'

    // Lifecycle / ViewModel / LiveData (Java, no Compose, no Coroutines/Flow)
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    // Required at runtime by ComponentActivity's default ViewModel factory.
    // Without it, `new ViewModelProvider(this).get(AuthViewModel.class)` can
    // fail at runtime on some dependency resolutions.
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.4'
    implementation 'androidx.activity:activity:1.9.1'

    // Networking - Retrofit/OkHttp (talks to Supabase REST/Auth + our Edge Functions)
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // Secure local session storage (Android Keystore backed)
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Email/SMS integration
    implementation 'androidx.work:work-runtime:2.9.1'          // background sync
    implementation 'com.google.android.gms:play-services-auth:21.2.0' // Gmail sign-in (server auth code)

    // NOTE (later phases add, per README build strategy):
    //   Room (local cache)              -> Phase 7 (Financial Event Engine)
    //   WorkManager (background sync)   -> Phase 4/5 (Gmail + Notifications)
    //   MPAndroidChart                  -> Phase 11 (Spending Analytics)
    //   Google Sign-In / Gmail API      -> Phase 4 (Gmail Integration)
    // They are intentionally left out of Phase 1 so the build stays lean
    // and every dependency present is actually used by shipped code.

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.mockito:mockito-core:5.12.0'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
